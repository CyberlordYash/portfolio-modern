<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yash Sachan">
  <!--
    Favicon: a "Y" monogram in the site's hueless graphite language, echoing
    the bordered brand box in the Hero header.

    Drawn as stroked geometry rather than set as text on purpose — a favicon
    has no access to the Orbitron webfont, so a <text> element would fall back
    to whatever the platform picks and render differently on every OS.

    The tile stays dark in both themes. A theme-reactive favicon sounds neat
    but browsers cache and composite it inconsistently; a dark tile with a
    white glyph is legible against light AND dark browser chrome, which is the
    only thing that actually matters at 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#0E0E11" />

  <!-- Inner hairline, the same 1px HUD edge the panels use -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Y: two diagonals meeting a stem. Round joins keep it from looking
       brittle once it is scaled down to 16px. -->
  <path d="M19 18 L32 35 L45 18 M32 35 V47"
        fill="none" stroke="#FFFFFF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
